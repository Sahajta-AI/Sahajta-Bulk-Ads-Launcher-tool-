# Production stack on the Oracle machine: web app, launch worker, Caddy (HTTPS).
# Start or update: docker compose up -d --build
# then free the disk: docker image prune -f && docker builder prune -f --filter until=24h

# Logs are capped (3 files of 10 MB per service), so they never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    image: sahajta-ads-launcher
    # A small init process as PID 1: passes on stop signals and cleans up finished child processes.
    init: true
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - launcher-data:/data
    restart: unless-stopped
    expose: ["3000"]
    logging: *logging

  worker:
    image: sahajta-ads-launcher
    depends_on: [app]
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - launcher-data:/data
    # node runs the worker itself (tsx loads the TypeScript). Not `npx tsx`: npx starts it through
    # `sh -c`, and on stop the shell dies without passing SIGTERM on, so the worker was killed
    # mid-job (checked 19 Nov 2026 with docker stop on this image).
    init: true
    command: ["node", "--import", "tsx", "src/worker/index.ts"]
    restart: unless-stopped
    healthcheck:
      disable: true
    # On stop the worker gives the running job 8 seconds, puts it back in the queue and exits
    # (about 10 seconds in all); Docker kills it only after 15.
    stop_grace_period: 15s
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    depends_on: [app]
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging: *logging

volumes:
  launcher-data:
  caddy-data:
  caddy-config:
